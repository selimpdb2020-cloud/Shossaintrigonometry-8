   অ্যাক্সেসযোগ্য। সেশন তথ্য (কে লগইন আছে) শুধু এই ডিভাইসের localStorage-এ থাকে।

   *** ব্যবহারের আগে অবশ্যই নিচের SUPABASE_URL ও SUPABASE_ANON_KEY পূরণ করুন ***
   ========================================================= */

const SUPABASE_URL = "https://rgppbokodspvoymtpowb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJncHBib2tvZHNwdm95bXRwb3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTg4NjcsImV4cCI6MjEwMTk3NDg2N30.p-dIbfxsQF-Y-Zl2DbYGhtyePnkMPF2LHVqGrRGcPRQ";

const supabaseClient = (SUPABASE_URL.startsWith('http') && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const STORAGE_BUCKET = "lms-uploads";

// ফাইলকে Supabase Storage-এ আপলোড করে পাবলিক URL রিটার্ন করে
async function uploadToStorage(file, folder){
  if (!supabaseClient){ toast('Supabase সংযোগ নেই'); return null; }
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safeName}`;
    const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, { upsert:true, contentType:file.type||undefined });
    if (error){ toast('আপলোড ব্যর্থ হয়েছে: ' + error.message); return null; }
    const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  } catch(e){
    toast('আপলোড ব্যর্থ হয়েছে');
    return null;
  }
}

// একটা URL-input এর নিচে "ফাইল আপলোড করুন" বাটন বসায়। ফাইল সিলেক্ট হলে আপলোড করে input-এ URL বসিয়ে দেয়।
function attachUploadWidget(containerId, urlInputId, folder, accept, label){
  const container = document.getElementById(containerId);
  if (!container) return;
  const wrapId = urlInputId + '-upload-wrap';
  container.insertAdjacentHTML('beforeend', `
    <div id="${wrapId}" style="margin:-2px 0 10px;">
      <label style="display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);">
        <span id="${wrapId}-txt">${icon('upload',14)} ${label||'ফোন থেকে ফাইল আপলোড করুন'}</span>
        <input type="file" id="${wrapId}-input" accept="${accept}" style="display:none;" />
      </label>
    </div>`);
  const fileInput = document.getElementById(wrapId+'-input');
  const txt = document.getElementById(wrapId+'-txt');
  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if (!file) return;
    txt.innerHTML = `${icon('loader',14)} আপলোড হচ্ছে...`;
    const url = await uploadToStorage(file, folder);
    if (url){
      const urlInput = document.getElementById(urlInputId);
      urlInput.value = url;
      urlInput.dispatchEvent(new Event('input'));
      toast('ফাইল আপলোড সম্পন্ন ✓');
      txt.innerHTML = `${icon('checkcircle',14)} আপলোড সম্পন্ন — আবার আপলোড করতে ট্যাপ করুন`;
    } else {
      txt.innerHTML = `${icon('upload',14)} ${label||'ফোন থেকে ফাইল আপলোড করুন'}`;
    }
  };
}

/* ---------- storage helpers ----------
   শেয়ার্ড ডেটা (topics/notes/students) -> Supabase টেবিল 'lms_kv' (key/value, jsonb)
   লোকাল ডেটা (এই ডিভাইসের সেশন) -> ব্রাউজার localStorage
------------------------------------------------------------- */
let _configWarned = false;
function warnIfNotConfigured(){
  if (!supabaseClient && !_configWarned){
    _configWarned = true;
    console.error('Supabase কনফিগার করা হয়নি — কোডের উপরের দিকে SUPABASE_URL ও SUPABASE_ANON_KEY পূরণ করুন।');
    toast('Supabase কনফিগার করা হয়নি — সেটআপ নির্দেশিকা দেখুন');
  }
}

async function loadShared(key, fallback){
  if (!supabaseClient){ warnIfNotConfigured(); return fallback; }
  try{
    const { data, error } = await supabaseClient
      .from('lms_kv')
      .select('value')
      .eq('key', key)
      .maybeSingle();
    if (error || !data) return fallback;
    return data.value;
  }catch(e){ console.error('loadShared failed', key, e); return fallback; }
}
async function saveShared(key, value){
  if (!supabaseClient){ warnIfNotConfigured(); return; }
  try{
    const { error } = await supabaseClient
      .from('lms_kv')
      .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) console.error('saveShared failed', key, error);
  }catch(e){ console.error('saveShared failed', key, e); }
}
async function deleteShared(key){
  if (!supabaseClient){ warnIfNotConfigured(); return false; }
  try{
    const { error } = await supabaseClient.from('lms_kv').delete().eq('key', key);
    if (error){ console.error('deleteShared failed', key, error); return false; }
    return true;
  }catch(e){ console.error('deleteShared failed', key, e); return false; }
}
async function loadLocal(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
async function saveLocal(key, value){
  try{
    if (value === null || value === undefined) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  }catch(e){ console.error('saveLocal failed', key, e); }
}

function todayLabel(){
  const d = new Date();
  const months = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const bn = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
  const num = String(d.getDate()).split('').map(c=>bn[+c]).join('');
  return `${num} ${months[d.getMonth()]}`;
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function normPhone(p){ return (p||'').replace(/\D/g,''); }

/* ---------- boot ---------- */
async function boot(){
  const [topics, notes, bq, idx, savedPhone] = await Promise.all([
    loadShared('lms:topics', null),
    loadShared('lms:notes', null),
    loadShared('lms:boardquestions', null),
    loadShared('lms:students:index', []),
    loadLocal('lms:session:phone', null),
  ]);
  S.topics = topics || DEFAULT_TOPICS;
  S.notes = notes || DEFAULT_NOTES;
  S.boardQuestions = bq || DEFAULT_BOARD_QUESTIONS;
  S.studentsIndex = idx || [];
  if (!topics) await saveShared('lms:topics', S.topics);
  if (!notes) await saveShared('lms:notes', S.notes);
  if (!bq) await saveShared('lms:boardquestions', S.boardQuestions);

  if (savedPhone){
    const rec = await loadShared('lms:student:'+savedPhone, null);
    if (rec){
      S.currentPhone = savedPhone;
      S.currentStudent = rec;
      S.role = 'student';
      S.screen = 'app';
      S.activeTopicId = S.topics[0] ? S.topics[0].id : null;
    }
  }
  S.role = 'admin';
  S.screen = 'app';
  S.loaded = true;
  render();
}

/* ---------- student data ops ---------- */
async function registerOrLoadStudent(phone, name, cls, school, guardianPhone, address){
  const key = 'lms:student:'+phone;
  let rec = await loadShared(key, null);
  if (!rec){
    rec = { phone, name: name||'', cls: cls||'নবম-দশম', school: school||'', guardianPhone: guardianPhone||'', address: address||'', joined: todayLabel(), paid:false, paymentMethod:null, completed:[] };
    await saveShared(key, rec);
    if (!S.studentsIndex.includes(phone)){
      S.studentsIndex.push(phone);
      await saveShared('lms:students:index', S.studentsIndex);
    }
  }
  return rec;
}
async function saveCurrentStudent(){
  if (!S.currentStudent) return;
  await saveShared('lms:student:'+S.currentStudent.phone, S.currentStudent);
}

/* ---------- derived helpers ---------- */
function visibleTopics(){
  return S.topics.map(t=>({...t, lessons: t.lessons.filter(l=>l.published!==false)}));
}
function visibleNotes(){ return S.notes.filter(n=>n.published!==false); }
function visibleBoardQuestions(){ return S.boardQuestions.filter(q=>q.published!==false); }
function getTopic(id){ return S.topics.find(t=>t.id===id); }
function totalPublishedLessons(){ return visibleTopics().reduce((a,t)=>a+t.lessons.length,0); }
function totalDoneCount(){
  if (!S.currentStudent) return 0;
  const validIds = new Set(visibleTopics().flatMap(t=>t.lessons.map(l=>t.id+'::'+l.id)));
  return (S.currentStudent.completed||[]).filter(k=>validIds.has(k)).length;
}
function isLessonDone(topicId, lessonId){
  return !!(S.currentStudent && (S.currentStudent.completed||[]).includes(topicId+'::'+lessonId));
}
function ytEmbed(url){
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
function isDirectVideo(url){
  if (!url) return false;
  return /\.(mp4|webm|ogg|mov|m4v)(\?|$)/i.test(url) || url.includes('/storage/v1/object/public/');
}

    return;
  }

  if (S.screen === 'landing'){

    nav.style.display = 'none';
    wireLanding();
    return;
  }

  if (S.role === 'student'){
    nav.style.display = S.screen === 'lesson' ? 'none' : 'flex';
    if (S.screen === 'lesson'){
      view.innerHTML = renderLesson();
      wireLesson();
    } else {
      view.innerHTML = renderStudentScreen();
      wireStudentScreen();
      nav.innerHTML = renderStudentNav();
      wireStudentNav();

  if (S.role === 'admin'){

    }
    nav.style.display = 'flex';

    wireAdminNav();
    return;
  }
}

const BOARD_ICON_STYLES = [
  { bg:'var(--blue-soft)',   fg:'var(--blue)' },
  { bg:'var(--green-soft)',  fg:'var(--green)' },
  { bg:'var(--orange-soft)', fg:'var(--orange)' },

function boardStyleFor(boardName, allBoards){
  const idx = allBoards.indexOf(boardName);
  return BOARD_ICON_STYLES[idx % BOARD_ICON_STYLES.length];
}

function wireAdminStudents(){
  let allStudents = [];
  (async ()=>{
    allStudents = await fetchAllStudents();
    paint('');
    paintDeleteAll();
  })();
  function paintDeleteAll(){
    const wrap = document.getElementById('delete-all-wrap');
    if (!wrap) return;
    wrap.innerHTML = allStudents.length ? `
      <button id="delete-all-students" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-weight:700;font-size:12.5px;cursor:pointer;">${icon('trash',14)} সব শিক্ষার্থীর একাউন্ট মুছে ফেলুন</button>` : '';
    const btn = document.getElementById('delete-all-students');
    if (btn) btn.onclick = async ()=>{
      if (!confirm(`আপনি কি নিশ্চিত? এতে ${allStudents.length} জন শিক্ষার্থীর সব তথ্য (অগ্রগতি, ভর্তি ফি অবস্থা সহ) স্থায়ীভাবে মুছে যাবে — এটা ফিরিয়ে আনা যাবে না।`)) return;
      btn.disabled = true; btn.textContent = 'মুছে ফেলা হচ্ছে…';
      const results = await Promise.all(S.studentsIndex.map(async p=>({ p, ok: await deleteShared('lms:student:'+p) })));
      const failed = results.filter(r=>!r.ok).map(r=>r.p);
      const succeeded = results.filter(r=>r.ok).map(r=>r.p);
      S.studentsIndex = S.studentsIndex.filter(p=>!succeeded.includes(p));
      await saveShared('lms:students:index', S.studentsIndex);
      allStudents = allStudents.filter(s=>!succeeded.includes(s.phone));
      if (failed.length){
        toast(`${succeeded.length} জন মুছে ফেলা হয়েছে, কিন্তু ${failed.length} জন ব্যর্থ হয়েছে — Supabase-এ DELETE অনুমতি (policy) আছে কিনা দেখুন`);
      } else {
        toast('সব শিক্ষার্থীর একাউন্ট মুছে ফেলা হয়েছে');
      }
      paint(''); paintDeleteAll();
    };
  }
  document.getElementById('add-student-btn').onclick = ()=>{ S.adminScreen='studentAdd'; render(); };
  function paint(q){
    const el = document.getElementById('students-list');
    if (!el) return;
    const filtered = q ? allStudents.filter(s=>(s.name||'').includes(q) || (s.phone||'').includes(q)) : allStudents;
    el.innerHTML = filtered.length===0 ? `<div class="muted" style="text-align:center;padding:24px;">কোনো শিক্ষার্থী পাওয়া যায়নি</div>` :
      filtered.map(s=>`
        <div class="card row student-row" data-phone="${s.phone}" style="gap:12px;padding:14px;cursor:pointer;">
          <div style="width:42px;height:42px;border-radius:21px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0;">${(s.name||'?').slice(0,1)}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:700;">${s.name||'(নাম নেই)'}</div>
            <div class="muted" style="font-size:12px;">${s.cls||''} শ্রেণী · ${s.phone}</div>
          </div>
          <span style="color:var(--muted);">${icon('chevronright',18)}</span>
        </div>`).join('');
    el.querySelectorAll('.student-row').forEach(r=>{
      r.onclick = ()=>{ S.selectedStudentPhone = r.dataset.phone; S.adminScreen='studentDetail'; render(); };
    });
  }
  const search = document.getElementById('student-search');
  if (search) search.addEventListener('input', ()=>paint(search.value.trim()));
}

function wireAdminStudentAdd(){
  document.getElementById('back-add').onclick = ()=>{ S.adminScreen='students'; render(); };
  let chosenCls = 'নবম';
  document.querySelectorAll('.asf-cls-btn').forEach(b=>{
    b.onclick = ()=>{
      chosenCls = b.dataset.cls;
      document.querySelectorAll('.asf-cls-btn').forEach(x=>{ x.style.background='var(--card)'; x.style.color='var(--ink)'; x.style.border='1px solid var(--line)'; });
      b.style.background = 'var(--orange)'; b.style.color = '#fff'; b.style.border='1px solid var(--orange)';
    };
  });
  document.querySelector('.asf-cls-btn[data-cls="নবম"]').click();

  const errorEl = document.getElementById('asf-error');
  const saveBtn = document.getElementById('asf-save');
  saveBtn.onclick = async ()=>{
    errorEl.textContent = '';
    const name = document.getElementById('asf-name').value.trim();
    const p = normPhone(document.getElementById('asf-phone').value);
    const address = document.getElementById('asf-address').value.trim();
    const pass = document.getElementById('asf-pass').value;
    const paid = document.getElementById('asf-paid').checked;
    if (!name){ errorEl.textContent = 'নাম লিখুন'; return; }
    if (p.length < 11){ errorEl.textContent = 'সঠিক মোবাইল নম্বর দিন'; return; }
    if (!pass || pass.length < 4){ errorEl.textContent = 'কমপক্ষে ৪ সংখ্যা/অক্ষরের পাসওয়ার্ড দিন'; return; }
    saveBtn.disabled = true;
    saveBtn.innerHTML = `${icon('flame',16)} সংরক্ষণ হচ্ছে…`;
    const existing = await loadShared('lms:student:'+p, null);
    if (existing){
      saveBtn.disabled = false;
      saveBtn.innerHTML = `${icon('check',16)} শিক্ষার্থী যোগ করুন`;
      errorEl.textContent = 'এই মোবাইল নম্বরে আগে থেকেই একাউন্ট আছে';
      return;
    }
    const rec = { phone:p, name, cls:chosenCls, school:'', guardianPhone:'', address, password:pass, joined: todayLabel(), paid, paymentMethod: paid ? 'manual' : null, completed:[] };
    await saveShared('lms:student:'+p, rec);
    if (!S.studentsIndex.includes(p)){
      S.studentsIndex.push(p);
      await saveShared('lms:students:index', S.studentsIndex);
    }
    toast('শিক্ষার্থী সফলভাবে যোগ হয়েছে ✓');
    S.adminScreen = 'students';
    render();
  };
}

function wireTopicRenameWidget(body, onSaved){
  const renameSelect = body.querySelector('#rename-topic-select');
  const renameInput = body.querySelector('#rename-topic-input');
  if (!renameSelect || !renameInput) return;
  renameSelect.onchange = ()=>{
    const t = S.topics.find(x=>x.id===renameSelect.value);
    if (t) renameInput.value = t.name;
  };
  body.querySelector('#rename-topic-save').onclick = async ()=>{
    const t = S.topics.find(x=>x.id===renameSelect.value);
    const newName = renameInput.value.trim();
    if (!t || !newName) return;
    t.name = newName;
    await saveShared('lms:topics', S.topics);
    toast('টপিকের নাম পরিবর্তন হয়েছে ✓');
    if (onSaved) onSaved();
  };
}

/* --- board questions admin --- */
let adminBoardState = { activeBoard:null, formMode:null, confirmDelete:null, confirmDeleteBoard:null };
function paintBoardAdmin(body){
  const qs = S.boardQuestions;
  const boards = [...new Set(qs.map(q=>q.board))];
  if (adminBoardState.activeBoard && !boards.includes(adminBoardState.activeBoard)){
    adminBoardState.activeBoard = null;
  }

  if (adminBoardState.activeBoard){
    paintBoardYearsAdmin(body, adminBoardState.activeBoard);
    return;
  }
  paintBoardListAdmin(body);
}

function bnDigitsToEn(s){
  const map = {'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
  return (s||'').replace(/[০-৯]/g, d=>map[d]);
}
function enToBnDigits(n){
  const map = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(n).split('').map(c=> /[0-9]/.test(c) ? map[+c] : c).join('');
}

            <div style="flex:1;min-width:0;">
              <div style="font-size:13.5px;font-weight:700;">${q.year} সাল</div>
              <div class="muted" style="font-size:11.5px;margin-top:2px;">${q.title}</div>
            </div>
            <button data-edit="${q.id}" class="icon-btn" style="width:26px;height:26px;flex-shrink:0;">${icon('pencil',12)}</button>
            <button data-del="${q.id}" class="icon-btn" style="width:26px;height:26px;flex-shrink:0;">${icon('trash',12)}</button>
            <div data-pub="${q.id}" class="row" style="gap:4px;cursor:pointer;padding:6px 9px;border-radius:999px;background:${q.published?'var(--green-soft)':'var(--soft)'};flex-shrink:0;">${icon(q.published?'eye':'eyeoff',12)}</div>
          </div>`}
        </div>`).join('')}
    </div>`;

  document.getElementById('bq-back-to-boards').onclick = ()=>{ adminBoardState.activeBoard=null; adminBoardState.formMode=null; render(); };
  body.querySelector('#add-bq-btn').onclick = ()=>{ adminBoardState.formMode='add'; paintForm(); };
  body.querySelectorAll('[data-edit]').forEach(el=>{ el.onclick = ()=>{ adminBoardState.formMode = el.dataset.edit; paintForm(); }; });
  body.querySelectorAll('[data-del]').forEach(el=>{ el.onclick = ()=>{ adminBoardState.confirmDelete = el.dataset.del; paintBoardYearsAdmin(body, boardName); }; });
  const cancelDel = body.querySelector('[data-cancel-del]');
  if (cancelDel) cancelDel.onclick = ()=>{ adminBoardState.confirmDelete=null; paintBoardYearsAdmin(body, boardName); };
  const confirmDel = body.querySelector('[data-confirm-del]');
  if (confirmDel) confirmDel.onclick = async ()=>{
    const id = confirmDel.dataset.confirmDel;
    S.boardQuestions = S.boardQuestions.filter(q=>q.id!==id);
    await saveShared('lms:boardquestions', S.boardQuestions);
    adminBoardState.confirmDelete = null;
    toast('প্রশ্নপত্রটি মুছে ফেলা হয়েছে');
    paintBoardYearsAdmin(body, boardName);
  };
  body.querySelectorAll('[data-pub]').forEach(el=>{
    el.onclick = async ()=>{
      const q = S.boardQuestions.find(x=>x.id===el.dataset.pub);
      q.published = !q.published;
      await saveShared('lms:boardquestions', S.boardQuestions);
      paintBoardYearsAdmin(body, boardName);
    };
  });
  if (adminBoardState.formMode) paintForm();

  function paintForm(){
    const formEl = document.getElementById('bq-form');
    const isAdd = adminBoardState.formMode==='add';
    const existing = isAdd? null : S.boardQuestions.find(q=>q.id===adminBoardState.formMode);
    formEl.innerHTML = `
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <div class="row between" style="margin-bottom:12px;">
          <span style="font-size:14px;font-weight:800;">${isAdd?'নতুন প্রশ্নপত্র':'প্রশ্নপত্র সম্পাদনা করুন'}</span>
          <button class="icon-btn" id="close-bqform">${icon('x',15)}</button>
        </div>
        <div class="field-label">সাল (যেমন: ২০২৬)</div>
        <input id="bq-year" class="field-input" value="${existing?existing.year:''}" placeholder="২০২৬" style="margin-bottom:10px;" />
        <div class="field-label">শিরোনাম</div>
        <input id="bq-title" class="field-input" value="${existing?existing.title:'এসএসসি — গণিত (ত্রিকোণমিতি অংশ)'}" placeholder="শিরোনাম লিখুন" style="margin-bottom:10px;" />
        <div class="field-label">পিডিএফ লিংক</div>
        <input id="bq-url" class="field-input" value="${existing?existing.url||'':''}" placeholder="https://example.com/question.pdf অথবা নিচে থেকে আপলোড করুন" style="margin-bottom:10px;" />
        <div id="bq-upload-container"></div>
        <div id="bq-preview"></div>
        <button class="btn btn-dark" id="bq-save" style="margin-top:4px;">${icon('check',15)} সংরক্ষণ করুন</button>
      </div>`;
    attachUploadWidget('bq-upload-container', 'bq-url', 'board-questions', 'application/pdf', 'ফোন থেকে PDF আপলোড করুন');
    formEl.querySelector('#close-bqform').onclick = ()=>{ adminBoardState.formMode=null; paintBoardYearsAdmin(body, boardName); };

    function paintPdfPreview(){
      const url = document.getElementById('bq-url').value.trim();
      const previewEl = document.getElementById('bq-preview');
      if (!url){
        previewEl.innerHTML = '';
      } else {
        previewEl.innerHTML = `
          <div style="margin-bottom:14px;">
            <div class="row between" style="margin-bottom:6px;">
              <span class="muted" style="font-size:11.5px;font-weight:700;">${icon('eye',12)} প্রিভিউ</span>
              <a href="${url}" target="_blank" rel="noopener noreferrer" class="muted" style="font-size:11px;font-weight:700;color:var(--blue);text-decoration:none;">নতুন ট্যাবে খুলুন ↗</a>
            </div>
            <div style="border-radius:12px;overflow:hidden;border:1px solid var(--line);height:260px;background:var(--soft);">
              <iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>
            </div>
          </div>`;
      }
    }
    document.getElementById('bq-url').addEventListener('input', paintPdfPreview);
    paintPdfPreview();

    formEl.querySelector('#bq-save').onclick = async ()=>{
      const year = document.getElementById('bq-year').value.trim();
      const title = document.getElementById('bq-title').value.trim() || 'এসএসসি — গণিত (ত্রিকোণমিতি অংশ)';
      const url = document.getElementById('bq-url').value.trim();
      if (!year) return;
      if (isAdd){
        S.boardQuestions.push({ id:'bq-'+Date.now(), year, board:boardName, title, url, published:false });
      } else {
        Object.assign(existing, { year, title, url });
      }
      await saveShared('lms:boardquestions', S.boardQuestions);
      adminBoardState.formMode = null;
      toast('সংরক্ষণ করা হয়েছে ✓');
      paintBoardYearsAdmin(body, boardName);
    };
  }
}

/* ---------- go ---------- */
boot();
</script>
</body>
</html>
